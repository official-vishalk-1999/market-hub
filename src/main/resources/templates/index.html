<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>MarketHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width:640px;margin-top:40px;">
  <h3 class="mb-3">MarketHub</h3>
  <table class="table bg-white shadow-sm">
    <thead><tr><th>Product</th><th>Price</th><th>Stock</th><th></th></tr></thead>
    <tbody>
      <tr th:each="p : ${products}">
        <td th:text="${p.name}"></td>
        <td th:text="${p.price}"></td>
        <td th:text="${p.stock}"></td>
        <td><button class="btn btn-sm btn-primary" th:onclick="'order(' + ${p.id} + ')'">Order</button></td>
      </tr>
    </tbody>
  </table>
  <h6 class="mt-4">Notifications</h6>
  <ul class="list-group">
    <li class="list-group-item" th:each="n : ${notifications}" th:text="${n.message}"></li>
  </ul>
</div>
<script>
function order(productId) {
  fetch("/orders", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ productId: productId, quantity: 1 })
  }).then(() => setTimeout(() => location.reload(), 1500));
}
</script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>MarketHub</title>
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">

    <style>
        body {
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #5f6dfc, #7b2cbf);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .glass-card {
            width: 420px;
            padding: 30px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(14px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>

<div class="glass-card">

    <h3 class="text-center mb-4">Welcome to MarketHub</h3>

    <!-- Tabs -->
    <ul class="nav nav-tabs">
        <li class="nav-item">
            <a class="nav-link active" data-toggle="tab" href="#admin">Admin</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" data-toggle="tab" href="#user">User</a>
        </li>
    </ul>

    <div class="tab-content mt-4">

        <div class="tab-pane fade show active" id="admin">

            <form method="post" action="/auth/login">

                <input type="hidden" name="role" value="ADMIN"/>

                <input type="text" name="username"
                       class="form-control mb-2"
                       placeholder="Admin Username" required>

                <input type="password" name="password"
                       class="form-control mb-3"
                       placeholder="Password" required>

                <button class="btn btn-dark btn-block">
                    Login as Admin
                </button>

            </form>
        </div>

        <div class="tab-pane fade" id="user">

            <form method="post" action="/auth/login">

                <input type="hidden" name="role" value="USER"/>

                <input type="text" name="username"
                       class="form-control mb-2"
                       placeholder="Username" required>

                <input type="password" name="password"
                       class="form-control mb-3"
                       placeholder="Password" required>

                <button class="btn btn-primary btn-block">
                    Login as User
                </button>

            </form>

            <div class="text-center mt-3">
                <a href="/auth/register" class="btn btn-success btn-sm">
                    Register
                </a>
            </div>
        </div>

    </div>

</div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

<script>
    const params = new URLSearchParams(window.location.search);

    if (params.get("registered") === "true") {
        alert("User registered successfully!");
    }

    if (params.get("error") === "true") {
        alert("Invalid credentials!");
    }
</script>

<script>
    (function () {
        const params = new URLSearchParams(window.location.search);
        const success = params.get("success");

        if (!success) return;

        let message = "";

        if (success === "added") message = "Product added successfully!";
        if (success === "updated") message = "Product updated successfully!";
        if (success === "deleted") message = "Product deleted successfully!";
        if (success === "ordered") message = "Order placed successfully!";
        if (success === "cancelled") message = "Order cancelled successfully!";

        if (message) {
            setTimeout(() => {
                alert(message);
            }, 100);

            window.history.replaceState({}, document.title, window.location.pathname);
        }
    })();
</script>

</body>
</html>

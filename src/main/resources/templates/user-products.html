<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Products</title>
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">

    <script>
        window.history.pushState(null, "", window.location.href);
        window.onpopstate = function () {
            window.location.href = "/";
        };
    </script>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <span class="navbar-brand">
        Welcome, <span th:text="${username}"></span>
    </span>
    <div>
        <a href="/user/orders" class="btn btn-info btn-sm">My Orders</a>
        <a href="/auth/logout" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<div class="container mt-3">
    <div th:if="${param.success == 'ordered'}" class="alert alert-success">
        Order placed successfully!
    </div>
</div>

<div class="container mt-4">

    <table class="table table-bordered">

        <thead>
        <tr>
            <th>Name</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="p : ${products}">
            <td th:text="${p.name}"></td>
            <td th:text="${p.price}"></td>
            <td th:text="${p.stock}"></td>
            <td>
                <a th:if="${p.stock > 0}"
                   th:href="@{'/user/buy/' + ${p.id}}"
                   class="btn btn-success btn-sm">
                    Buy
                </a>

                <button th:if="${p.stock == 0}"
                        class="btn btn-secondary btn-sm" disabled>
                    Out of Stock
                </button>
            </td>
        </tr>
        </tbody>

    </table>

</div>

<script>
    (function () {
        const params = new URLSearchParams(window.location.search);
        const success = params.get("success");

        if (!success) return;

        let message = "";

        if (success === "added") message = "Product added successfully!";
        if (success === "updated") message = "Product updated successfully!";
        if (success === "deleted") message = "Product deleted successfully!";
        if (success === "ordered") message = "Order placed successfully!";
        if (success === "cancelled") message = "Order cancelled successfully!";

        if (message) {
            setTimeout(() => {
                alert(message);
            }, 100);

            window.history.replaceState({}, document.title, window.location.pathname);
        }
    })();
</script>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Product</title>
    <link href="/css/sb-admin-2.min.css" rel="stylesheet">

    <script>
        window.history.pushState(null, "", window.location.href);
        window.onpopstate = function () {
            window.location.href = "/";
        };
    </script>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <span class="navbar-brand">
        Welcome, <span th:text="${username}"></span>
    </span>
    <div>
        <a href="/admin/dashboard" class="btn btn-primary btn-sm">Dashboard</a>
        <a href="/admin/products" class="btn btn-success btn-sm">Products</a>
        <a href="/auth/logout" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<div class="container mt-5">

    <h3>Add Product</h3>

    <form method="post" action="/admin/add-product">

        <div class="form-group">
            <input type="text" name="name"
                   class="form-control"
                   placeholder="Product Name" required>
        </div>

        <div class="form-group">
            <input type="number" name="price"
                   class="form-control"
                   placeholder="Price" required>
        </div>

        <div class="form-group">
            <input type="number" name="stock"
                   class="form-control"
                   placeholder="Quantity" required>
        </div>

        <button type="submit" class="btn btn-primary">
            Add Product
        </button>

    </form>

</div>

</body>
</html>
